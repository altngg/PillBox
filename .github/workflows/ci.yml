name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pillbox
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_pillbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Tests
        env:
          DATABASE_URL: postgresql://pillbox:test_password@localhost:5432/test_pillbox
        run: |
          # Если есть тесты, раскомментируй строку ниже
          # cd backend && pytest -v
          echo "No tests found or tests skipped"

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Images
        run: |
          docker compose build
          echo "Docker images built successfully"