
services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pillbox-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pillbox-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pillbox-backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-pillbox}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-pillbox}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-pillbox}
      - MINIO_PUBLIC_URL=http://localhost:9000 
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
    volumes:
      - backend-static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - pillbox-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: pillbox-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-pillbox}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=${DB_NAME:-pillbox}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pillbox-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pillbox} -d ${DB_NAME:-pillbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: pillbox-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - pillbox-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: pillbox-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-pillbox}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set pillbox http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY 2>/dev/null; do
        sleep 2;
      done;
      /usr/bin/mc mb -p pillbox/$$MINIO_BUCKET_NAME 2>/dev/null || true;
      /usr/bin/mc anonymous set public pillbox/$$MINIO_BUCKET_NAME 2>/dev/null || true;
      "
    networks:
      - pillbox-net
    profiles:
      - init

networks:
  pillbox-net:
    driver: bridge
    name: pillbox-net

volumes:
  postgres-data:
    name: pillbox-postgres-data
  minio-data:
    name: pillbox-minio-data
  backend-static:
    name: pillbox-backend-static